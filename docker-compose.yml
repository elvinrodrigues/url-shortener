services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: urlshortener
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: password123
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d urlshortener"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      # docker-entrypoint-initdb.d executes only when initializing a fresh/empty volume.
      # For existing database volumes, new migrations must be applied using cmd/migrate:
      #   DATABASE_URL=postgres://appuser:password123@localhost:5432/urlshortener?sslmode=disable go run ./cmd/migrate
      - ./migrations:/docker-entrypoint-initdb.d

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgres://appuser:password123@postgres:5432/urlshortener?sslmode=disable
      REDIS_ADDR: redis:6379
      JWT_SECRET: supersecretkey
      PORT: ":8000"
      BASE_URL: "http://localhost:8000"
      # Which peers' X-Forwarded-For headers may be believed when attributing a
      # request to a client IP. Unset means loopback + RFC1918/RFC4193, which is
      # correct for this compose network. In a real deployment set this to the
      # edge proxy's CIDR; "*" trusts every peer and re-opens header spoofing.
      # TRUSTED_PROXIES: "10.0.0.0/8"
      # Rate limiter policy when Redis is unreachable. Default is false (fail-closed,
      # returning 503 on POST /shorten to prevent abuse). Set to "true" to fail-open.
      # RATE_LIMIT_FAIL_OPEN: "false"
      GOOGLE_CLIENT_ID: "716971806941-d1qktup2q64pttiqr5knron4olf3kudj.apps.googleusercontent.com"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started