<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="slug-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF4500" />
      <stop offset="60%" stop-color="#FF5A00" />
      <stop offset="100%" stop-color="#FF7A00" />
    </linearGradient>
    <linearGradient id="link-grad" x1="16" y1="16" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFF0E6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="64" height="64" rx="16" fill="url(#slug-grad)" filter="url(#glow)" />
  
  <!-- Subtle Highlight Border -->
  <rect x="0.5" y="0.5" width="63" height="63" rx="15.5" stroke="rgba(255,255,255,0.25)" stroke-width="1" />

  <!-- Crisp Link Icon (Link2) -->
  <g transform="translate(14, 14)" stroke="url(#link-grad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- First Link Loop -->
    <path d="M13.5 6.5l3.5-3.5a5.657 5.657 0 0 1 8 8l-3.5 3.5a5.657 5.657 0 0 1-8 0" />
    <!-- Second Link Loop -->
    <path d="M22.5 29.5l-3.5 3.5a5.657 5.657 0 0 1-8-8l3.5-3.5a5.657 5.657 0 0 1 8 0" />
    <!-- Connector Beam -->
    <line x1="12" y1="24" x2="24" y2="12" />
  </g>
</svg>
